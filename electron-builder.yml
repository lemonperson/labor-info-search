appId: org.laborinfosearch.desktop
productName: 劳动信息检索
asar: true
asarUnpack:
  - "**/better-sqlite3/prebuilds/win32-x64.node"
  - "**/tesseract.js/src/worker-script/node/index.js"
directories:
  output: dist
files:
  - out/**/*
  - '!out/main/e2e-fixture-connector-*.js'
  - package.json
  - THIRD_PARTY_NOTICES.md
  - '!node_modules/better-sqlite3/deps/**/*'
  - '!node_modules/better-sqlite3/src/**/*'
  - '!node_modules/better-sqlite3/build/**/*'
  - '!node_modules/better-sqlite3/prebuilds/darwin-*'
  - '!node_modules/better-sqlite3/prebuilds/linux-*'
  - '!node_modules/better-sqlite3/prebuilds/linuxmusl-*'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
extraResources:
  - from: resources/ocr/chi_sim.traineddata.gz
    to: ocr/chi_sim.traineddata.gz
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icons/icon.ico
  artifactName: "${productName}-${version}-${arch}.${ext}"
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-${version}-${arch}-portable.${ext}"
npmRebuild: false
